[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mcts-reasoning-engine"
version = "0.2.0"
description = "Monte Carlo Tree Search (PUCT) guided by a dual-head Process Reward Model on Countdown in pure PyTorch."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.1.0",
    "matplotlib>=3.7.0",
    "gradio>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
